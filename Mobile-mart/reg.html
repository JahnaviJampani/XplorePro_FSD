<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reg form</title>
    <link rel="stylesheet" href="reg.css">
</head>
<body>
    <form>
        <fieldset>
            <legend>Registration Form</legend>
            <h1>Sign Up</h1>
            <p class="subtitle">Create your account</p>
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" placeholder="Enter username" required>
            <br><br>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="Enter email" required>
            <br><br>

            <label for="password">Password:</label>
            <input type="password" maxlength="8" minlength="6" id="pwd" name="password" placeholder="Enter password" required>
            <br><br>

            <label for="phn">Phone Number:</label>
            <input type="tel" pattern="[6-9]{1}[0-9]{9}"  id="phn" name="Phone Number" placeholder="Enter Phone Number" required>
            <br><br>

            <label for="dob">DateOfBirth: </label>
            <input required id="dob" type="date">
            <br><br>

            <label for="gender">Gender: </label>
            <input type="radio" name="gender" value="male"><span>Male</span>
            <input type="radio" name="gender" value="female"><span>Female</span>
            <input type="radio" name="gender" value="others"><span>Others</span>
            <br><br>

            <label for="state">State</label>
            <select name="state" id="state">
                <option value="NA">Choose State:</option>
                <option value="Andhra Pradesh">AP</option>
                <option value="Telangana">TS</option>
                <option value="Tamil Nadu">TN</option>
                <option value="Kerala">KL</option>
                <option value="Karnataka">KN</option>
            </select>

            <label for="address">Address: </label>
            <textarea rows="2" cols="30" name="" id="" placeholder="Enter Full Address"></textarea>
            <br><br>

            <label for="">Profile Pic:</label>
            <input type="file" accept=".png .jpeg .jpg">
            <br><br>

            <div class="buttons">
                <button type="submit">Register</button>
                <button type="submit">Reset</button>
            </div>
        </fieldset>
    </form>
</body>
</html>
