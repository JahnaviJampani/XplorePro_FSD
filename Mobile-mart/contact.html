<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Think Mart - Contact Us</title>

    <link rel="stylesheet" href="contact.css">

</head>

<body>

    <header>

        <div class="logo">
            Think Mart
        </div>

        <nav>
            <a href="Home-Page.html">Home</a>
            <a href="Products.html">Products</a>
            <a href="About.html">About</a>
            <a href="Contact.html">Contact</a>
            <a href="Cart.html">Cart</a>
            <a href="index.html">Logout</a>
        </nav>

    </header>


    <main>

        <h1 class="title">
            Contact Us
        </h1>

        <p class="subtitle">
            We would love to hear from you!
        </p>


        <section class="contact-container">


            <div class="contact-info">

                <h2>
                    Get In Touch
                </h2>

                <p>
                    📍 Guntur, Andhra Pradesh, India
                </p>

                <p>
                    📞 +91 98765 43210
                </p>

                <p>
                    ✉️ support@thinkmart.com
                </p>

                <h3>
                    Follow Us
                </h3>

                <div class="social">

                    <a href="#">Facebook</a>
                    <a href="#">Instagram</a>
                    <a href="#">Twitter</a>

                </div>

            </div>


            <div class="contact-form">

                <h2>
                    Send Us a Message
                </h2>

                <form>

                    <label for="name">
                        Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your name"
                        required>


                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required>


                    <label for="message">
                        Message
                    </label>

                    <textarea
                        id="message"
                        rows="6"
                        placeholder="Enter your message"
                        required></textarea>


                    <button type="submit">
                        Send Message
                    </button>

                </form>

            </div>

        </section>

    </main>

</body>

</html>
