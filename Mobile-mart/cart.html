<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Think Mart - Cart</title>

    <link rel="stylesheet" href="cart.css">

</head>

<body>

    <header>

        <div class="logo">
            Think Mart
        </div>

        <nav>
            <a href="Home-Page.html">Home</a>
            <a href="Products.html">Products</a>
            <a href="About.html">About</a>
            <a href="Contact.html">Contact</a>
            <a href="Cart.html">Cart</a>
            <a href="index.html">Logout</a>
        </nav>

    </header>


    <main>

        <h1 class="title">
            Shopping Cart
        </h1>


        <section class="cart-container">

            <div class="cart-items">


                <div class="cart-item">

                    <img
                        src="https://images.samsung.com/is/image/samsung/assets/ae/p6_gro2/p6_initial_gstatic/galaxy-5g/life-in-5g/T2_5g-products_mo_708x630.jpg?$720_N_JPG$"
                        alt="Samsung Mobile">

                    <div class="item-details">

                        <h2>
                            Samsung Galaxy
                        </h2>

                        <p>
                            Rating: ★★★★★
                        </p>

                        <p class="item-price">
                            ₹40,000
                        </p>

                    </div>

                    <div class="quantity">

                        <button>-</button>

                        <span>1</span>

                        <button>+</button>

                    </div>

                    <div class="total">
                        ₹40,000
                    </div>

                </div>


                <div class="cart-item">

                    <img
                        src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=800"
                        alt="Smart Watch">

                    <div class="item-details">

                        <h2>
                            Smart Watch
                        </h2>

                        <p>
                            Rating: ★★★★★
                        </p>

                        <p class="item-price">
                            ₹3,750
                        </p>

                    </div>

                    <div class="quantity">

                        <button>-</button>

                        <span>1</span>

                        <button>+</button>

                    </div>

                    <div class="total">
                        ₹3,750
                    </div>

                </div>

            </div>


            <aside class="summary">

                <h2>
                    Order Summary
                </h2>

                <div>
                    <span>Subtotal</span>
                    <span>₹43,750</span>
                </div>

                <div>
                    <span>Delivery</span>
                    <span>₹100</span>
                </div>

                <hr>

                <div class="grand-total">
                    <span>Total</span>
                    <span>₹43,850</span>
                </div>

                <button class="checkout">
                    Proceed to Checkout
                </button>

            </aside>

        </section>

    </main>

</body>

</html>
