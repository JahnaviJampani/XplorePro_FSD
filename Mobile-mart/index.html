<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Think Mart - Login</title>

    <link rel="stylesheet" href="login.css">

</head>

<body>

    <div class="login-container">

        <div class="login-card">

            <div class="logo">
                Think Mart
            </div>

            <h1>Welcome Back!</h1>

            <p class="subtitle">
                Login to continue shopping
            </p>

            <form action="Home-Page.html">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required>


                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required>


                <div class="remember">

                    <label>
                        <input type="checkbox">
                        Remember me
                    </label>

                    <a href="#">
                        Forgot Password?
                    </a>

                </div>


                <button type="submit">
                    Login
                </button>

            </form>


            <p class="register-text">

                Don't have an account?

                <a href="Register-Page.html">
                    Register
                </a>

            </p>

        </div>

    </div>

</body>

</html>
